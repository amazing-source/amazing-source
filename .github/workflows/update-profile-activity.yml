name: update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/build_profile_activity.py"
      - ".github/workflows/update-profile-activity.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build activity svgs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_profile_activity.py

      - name: commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/contributions.svg
          if git diff --cached --quiet; then
            echo "No profile activity changes"
            exit 0
          fi
          git commit -m "chore: refresh profile activity"
          git push
